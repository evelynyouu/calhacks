services:
  - type: web
    name: firstfund
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SESSION_SECRET      # signs the session cookie; generated once, so a sleep/redeploy doesn't log everyone out
        generateValue: true
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: NESSIE_API_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
