<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FirstFund{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Fonts load without blocking the page; offline, the system fonts below are used instead. -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <!-- Scripts are bundled in /static/vendor (pinned versions) so the demo works on bad wifi. -->
  <script src="/static/vendor/tailwind-3.4.17.js"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { display: ['Fraunces', 'Georgia', 'serif'], sans: ['Inter', 'system-ui', 'sans-serif'] },
      colors: { ink: '#1b2420', paper: '#f6f3ec', moss: { 50: '#eef5ef', 100: '#d8e8db', 500: '#2f7a4f', 600: '#25633f', 700: '#1c4c31' },
                clay: { 100: '#f7e3d6', 500: '#c2603a' }, sun: { 100: '#fbf0cc', 500: '#c99a1a' } } } } }
  </script>
  <script src="/static/vendor/htmx-2.0.4.min.js"></script>
  <script src="/static/vendor/chart-4.4.4.umd.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/tape.css">
</head>
<body class="bg-paper text-ink font-sans antialiased min-h-screen">
  {# Ticker strip: pinned to the top of every page. Pages without it (login) override this block with nothing. #}
  {% block tape %}<div class="tape-dock">{% include "partials/tape_loader.html" %}</div>{% endblock %}
  <header class="max-w-6xl mx-auto px-4 sm:px-6 py-5 flex items-center justify-between">
    <a href="/" class="font-display text-2xl font-bold tracking-tight">First<span class="text-moss-500">Fund</span></a>
    {% block header_right %}{% endblock %}
  </header>
  <main class="max-w-6xl mx-auto px-4 sm:px-6 pb-16">{% block content %}{% endblock %}</main>
  <script src="/static/app.js"></script>
</body>
</html>
