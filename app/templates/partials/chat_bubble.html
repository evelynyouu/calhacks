{% if m.role == 'user' %}
<div class="flex justify-end ff-msg-in">
  <p class="max-w-[85%] rounded-lg bg-paper px-4 py-3 text-base whitespace-pre-line">{{ m.text }}</p>
</div>
{% else %}
<div class="flex gap-3 ff-msg-in">
  <div class="h-7 w-7 shrink-0 rounded-full bg-ink text-white grid place-items-center text-xs font-semibold" aria-hidden="true">F</div>
  <div class="max-w-[90%] pt-1">
    <div class="text-base ff-prose" data-md="{{ m.text | e }}"></div>
    {% if m.link %}<a href="{{ m.link.href }}" class="mt-2 inline-block link text-sm">{{ m.link.label }}</a>{% endif %}
  </div>
</div>
{% endif %}
