{% if m.role == 'user' %}
<div class="flex justify-end"><p class="max-w-[85%] rounded-2xl rounded-br-md bg-ink/[.06] px-4 py-2.5 text-[.95rem] leading-relaxed whitespace-pre-line">{{ m.text }}</p></div>
{% else %}
<div class="flex gap-3">
  <div class="mt-0.5 h-7 w-7 shrink-0 rounded-full bg-moss-600 text-white grid place-items-center font-display text-sm font-bold" aria-hidden="true">F</div>
  <div class="max-w-[90%] pt-0.5">
    <p class="text-[.95rem] leading-relaxed whitespace-pre-line">{{ m.text }}</p>
    {% if m.link %}<a href="{{ m.link.href }}" class="mt-2 inline-block text-sm font-medium text-moss-600">{{ m.link.label }}</a>{% endif %}
  </div>
</div>
{% endif %}
