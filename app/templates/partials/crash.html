<section id="crash" {% if swap_oob %}hx-swap-oob="true"{% endif %} class="card {% if not portfolio %}hidden{% endif %}">
  <p class="eyebrow">Crash test</p>
  <h2 class="font-display text-xl font-bold mt-1">Your fund just dropped 30%. What do you do?</h2>
  <div class="mt-3 flex flex-wrap gap-2">
    {% for key, label in [('sell', 'Sell'), ('hold', 'Wait it out'), ('buy', 'Buy more')] %}
    <button class="btn-ghost" hx-post="/p/{{ cid }}/crash/{{ key }}" hx-target="#crash-result">{{ label }}</button>
    {% endfor %}
  </div>
  <div id="crash-result" class="mt-3"></div>
</section>
