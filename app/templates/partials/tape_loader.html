{# Same size as the strip it becomes, so nothing on the page jumps when prices arrive. #}
<div id="tape" class="tape tape-loading" role="region" aria-label="Market prices"
     hx-get="/tape{% if cid is defined and cid %}?cid={{ cid }}{% endif %}" hx-trigger="load" hx-swap="outerHTML">
  <span class="tape-item tape-note">Loading market prices…</span>
</div>
